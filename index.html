<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conquest Run - Alpha</title>
    <!-- Lien vers le manifeste pour PWABuilder et l'installation mobile -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Leaflet CSS pour la carte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; }
        #ui-panel { background: #1e293b; padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-box { background: #334155; padding: 8px; border-radius: 8px; }
        .stat-value { font-size: 16px; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .clan-reserve { background: #0f172a; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .reserve-text { font-size: 13px; color: #cbd5e1; }
        .reserve-val { font-weight: bold; color: #22c55e; }
        .actions-flex { display: flex; gap: 10px; }
        button { flex: 1; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; color: white; }
        #btn-action { background: #22c55e; }
        #btn-action.running { background: #ef4444; }
        #btn-defend { background: #3b82f6; }
        #btn-defend:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- La Carte -->
    <div id="map"></div>

    <!-- Le Panneau de Contrôle & HUD -->
    <div id="ui-panel">
        <!-- Réserve de boucliers du Clan -->
        <div class="clan-reserve">
            <span class="reserve-text">🛡️ Réserve de Boucliers du Clan :</span>
            <span class="reserve-val" id="shield-reserve">150 pts</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="speed">0.0</div>
                <div class="stat-label">Km/h</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="km-run">0.00</div>
                <div class="stat-label">Km Parcourus</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="zone-health">85%</div>
                <div class="stat-label">Intégrité Zone</div>
            </div>
        </div>

        <div class="actions-flex">
            <button id="btn-action" onclick="toggleRun()">Lancer la Mission</button>
            <button id="btn-defend" onclick="repairZone()">Réparer Zone (+20%)</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte (centrée par défaut dans l'Eure)
        var map = L.map('map').setView([49.23, 1.35], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Territoire fictif contrôlé par votre Clan
        var testZoneCoords = [
            [49.235, 1.345],
            [49.235, 1.360],
            [49.225, 1.360],
            [49.225, 1.345]
        ];

        var territoryPolygon = L.polygon(testZoneCoords, {
            color: '#3b82f6',
            fillColor: '#3b82f6',
            fillOpacity: 0.4
        }).addTo(map).bindPopup("<b>Secteur : Le Plateau</b><br>Statut : Sécurisé<br>Gouverneur : Clan Alpha");

        let isRunning = false;
        let watchId = null;
        let totalDistanceKm = 0;
        let clanShields = 150; // Réserve de départ
        let zoneHealth = 85;   // Intégrité initiale de la zone
        let lastLat = null;
        let lastLon = null;

        function toggleRun() {
            const btn = document.getElementById('btn-action');
            if (!isRunning) {
                if (navigator.geolocation) {
                    isRunning = true;
                    btn.innerText = "Arrêter la Mission";
                    btn.classList.add('running');
                    totalDistanceKm = 0;
                    
                    watchId = navigator.geolocation.watchPosition(successGPS, errorGPS, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    });
                } else {
                    alert("La géolocalisation n'est pas supportée par votre appareil.");
                }
            } else {
                isRunning = false;
                btn.innerText = "Lancer la Mission";
                btn.classList.remove('running');
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
                document.getElementById('speed').innerText = "0.0";
                
                // Fin de course : Conversion des kilomètres en points de bouclier pour le clan!
                let earnedShields = Math.floor(totalDistanceKm * 50); // 50 pts par km
                clanShields += earnedShields;
                updateUI();
                if(earnedShields > 0) {
                    alert(`Mission terminée !\nVous avez rapporté ${earnedShields} points de bouclier à la réserve du clan grâce à vos ${totalDistanceKm.toFixed(2)} km.`);
                }
            }
        }

        function successGPS(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var speedMs = position.coords.speed || 0;
            var speedKmH = (speedMs * 3.6).toFixed(1);

            document.getElementById('speed').innerText = speedKmH;

            // Anti-triche basique (Velo / Trottinette / Voiture)
            if (speedKmH > 25) {
                alert("⚠️ Alerte anti-triche : Vitesse trop élevée détectée ! Session invalidée.");
                toggleRun();
                return;
            }

            // Calcul de la distance parcourue par rapport au point GPS précédent
            if (lastLat !== null && lastLon !== null) {
                let distanceMeters = getDistanceFromLatLonInKm(lastLat, lastLon, lat, lon) * 1000;
                if (distanceMeters > 2 && distanceMeters < 100) {
                    totalDistanceKm += distanceMeters / 1000;
                    document.getElementById('km-run').innerText = totalDistanceKm.toFixed(2);
                }
            }

            lastLat = lat;
            lastLon = lon;
            map.setView([lat, lon], 16);
        }

        function errorGPS(error) {
            console.warn("Erreur GPS : " + error.message);
        }

        // Fonction pour réparer le territoire en dépensant des boucliers de la réserve
        function repairZone() {
            let cost = 30; // Coût de la réparation
            if (clanShields >= cost && zoneHealth < 100) {
                clanShields -= cost;
                zoneHealth = Math.min(100, zoneHealth + 20);
                updateUI();
                alert("Zone réparée avec succès ! Intégrité renforcée.");
            } else if (clanShields < cost) {
                alert("Pas assez de points de bouclier dans la réserve du clan ! Envoyez des coureurs faire du volume.");
            } else {
                alert("Le territoire est déjà à 100% de ses capacités.");
            }
        }

        function updateUI() {
            document.getElementById('shield-reserve').innerText = clanShields + " pts";
            document.getElementById('zone-health').innerText = zoneHealth + "%";
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; // Rayon de la terre en km
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1);
            var a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2)
            ; 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            var d = R * c;
            return d;
        }

        function deg2rad(deg) {
            return (deg * Math.PI) / 180;
        }
    </script>
</body>
</html>
